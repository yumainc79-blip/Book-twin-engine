[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-twin-engine"
version = "0.5.0"
description = "Create AI-native book repositories from readable books."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Book Twin"}]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "PyYAML>=6.0.1",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "ebooklib>=0.18",
  "jsonschema>=4.21",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "reportlab>=4.0"]
mcp = ["mcp>=1.2.0"]
embeddings = ["sentence-transformers>=2.2.0", "numpy>=1.24"]

[project.scripts]
booktwin = "book_twin.cli:app"
booktwin-mcp = "book_twin.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
